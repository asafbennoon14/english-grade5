<tr><td>עיצור + y → <b>ies</b></td><td>cry → cries, fly → flies</td></tr><tr><td>תנועה (a,e,o,u) + y → <b>s</b></td><td>play → plays</td></tr></table>
<div class="tip">💡 I / you / we / they → בלי סיומת: I play, they play.</div></div>
<div class="card"><h2>🟠 רבים – Plural</h2><table class="en"><tr><th>Rule</th><th>Example</th></tr><tr><td>+s</td><td>bird → birds, key → keys</td></tr><tr><td>s, sh, ch, x, o → es</td><td>match → matches, potato → potatoes</td></tr>
<tr><td>עיצור + y → ies</td><td>lady → ladies, baby → babies</td></tr><tr><td>f / fe → ves</td><td>leaf → leaves, wife → wives (but chief → chiefs)</td></tr></table>
<p><b>מילים חריגות שצריך לזכור בעל פה:</b></p><table class="en"><tr><td>man → men</td><td>woman → women</td><td>child → children</td></tr><tr><td>tooth → teeth</td><td>foot → feet</td><td>goose → geese</td></tr><tr><td>mouse → mice</td><td>fish → fish</td><td>sheep → sheep, deer → deer</td></tr></table></div>
<div class="card"><h2>✍️ טיפים לכתיבה</h2><ul><li>משפט מתחיל ב<b>אות גדולה</b> ונגמר ב<b>נקודה</b>.</li><li>סדר המילים: <b>מי? + am/is/are + מה?</b> → <span class="en">She is happy.</span></li><li>בודקים: האם התאמתי את am/is/are לכינוי הגוף?</li></ul></div>`;
// ---------- מנוע ----------
const sets=PR.concat([READ,WRITE]);
const nav=document.getElementById('nav'),main=document.getElementById('main');
const tabs=[['learn','📖 הסברים']].concat(T.map((t,i)=>['p'+i,t])).concat([['exam','📝 מבחן מסכם']]);
tabs.forEach(([id,n])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.id='b_'+id;b.onclick=()=>show(id);nav.appendChild(b)});
function show(id){document.querySelectorAll('.sec,nav button').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on');document.getElementById('b_'+id).classList.add('on');scrollTo(0,0)}
function qhtml(q,id,n){let h=`<div class="card q" id="${id}"><p class="en"><b>${n}.</b> <span dir="auto">${q.q}</span></p><div class="en">`;
if(q.t=='txt')h+=`<input type="text" id="${id}_a" class="${q.w?'wide':''}" autocomplete="off" autocapitalize="off" spellcheck="false">`;
else h+=q.o.map(o=>`<label class="opt"><input type="radio" name="${id}" value="${o.replace(/"/g,'&quot;')}"> ${o}</label>`).join('');
return h+`</div><div class="exp" id="${id}_e"></div></div>`}
const norm=s=>String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/[.!?,]/g,'').replace(/\s+/g,' ').trim();
function check(q,id){let ok;if(q.t=='txt'){ok=q.a.some(x=>norm(x)===norm(document.getElementById(id+'_a').value))}else{const s=document.querySelector(`input[name="${id}"]:checked`);ok=!!s&&s.value===q.a}
const b=document.getElementById(id);b.classList.remove('ok','bad');b.classList.add(ok?'ok':'bad');const e=document.getElementById(id+'_e');e.style.display='block';
const right=q.t=='txt'?q.a[0]:q.a;e.innerHTML=(ok?'✅ נכון! ':`❌ לא נכון. התשובה הנכונה: <b dir="ltr">${right}</b><br>`)+'<b>הסבר:</b> <span dir="auto">'+q.e+'</span>';return ok}
function reset(id){document.querySelectorAll('#'+id+' input').forEach(i=>{i.type=='radio'?i.checked=false:i.value=''});document.querySelectorAll('#'+id+' .q').forEach(q=>q.classList.remove('ok','bad'));document.querySelectorAll('#'+id+' .exp').forEach(e=>e.style.display='none');document.getElementById(id+'_r').innerHTML=''}
const msg=p=>p>=90?'🌟 Excellent! מצוין!':p>=75?'👍 Very good! כדאי לעבור שוב על הטעויות.':p>=55?'💪 Good try! כדאי לחזור על ההסבר ולנסות שוב.':'📖 צריך לחזק – כדאי לקרוא שוב את ההסבר ולנסות שוב.';
let H=`<section class="sec" id="learn">${LEARN}</section>`;
sets.forEach((qs,k)=>{H+=`<section class="sec" id="p${k}"><div class="card"><h2>${T[k]}</h2>${k==6?`<div class="story en">${STORY}</div><p>${S(STORY.replace(/<br>/g,' '))} אפשר ללחוץ כדי לשמוע את הסיפור. קראי אותו ואז עני על השאלות.</p>`:'עני על כל השאלות ולחצי "בדיקה".'}${k==7?'<br><small>לא חשוב אם כתבת באותיות גדולות או קטנות, וגם לא אם שמת נקודה בסוף. הבדיקה מתעלמת מזה.</small>':''}</div>`+qs.map((q,i)=>qhtml(q,`p${k}q${i}`,i+1)).join('')+
`<div class="card" style="text-align:center"><button type="button" class="btn" onclick="chkP(${k})">✔️ בדיקה</button><button type="button" class="btn gray" onclick="reset('p${k}')">🔄 נסי שוב</button><div class="res" id="p${k}_r"></div></div></section>`});
H+=`<section class="sec" id="exam"><div class="card"><h2>📝 מבחן מסכם</h2>${EX.length} שאלות מכל הנושאים. השאלה על הסיפור מתייחסת לסיפור מלשונית "הבנת הנקרא". עבדי לבד, ובסוף תקבלי ציון ופירוט לפי נושא.</div>`+EX.map((q,i)=>qhtml(q,'exq'+i,i+1)).join('')+
`<div class="card" style="text-align:center"><button type="button" class="btn" onclick="chkE()">✔️ הגשה ובדיקה</button><button type="button" class="btn gray" onclick="reset('exam')">🔄 מבחן מחדש</button><div id="exam_r"></div></div></section>`;
main.innerHTML=H;
document.getElementById('flash').innerHTML=VOC.map(([en,he])=>`<span class="flash" onclick="this.classList.toggle('f');this.querySelector('b').textContent=this.classList.contains('f')?'${he}':'${en}'"><b>${en}</b></span>${S(en)}`).join('');
show('learn');
function chkP(k){let c=0;sets[k].forEach((q,i)=>{if(check(q,`p${k}q${i}`))c++});const p=Math.round(c/sets[k].length*100);document.getElementById(`p${k}_r`).innerHTML=`${c} / ${sets[k].length} (${p}%)<br>${msg(p)}`}
function chkE(){const s=T.map(()=>[0,0]);let c=0;EX.forEach((q,i)=>{const ok=check(q,'exq'+i);s[q.k][1]++;if(ok){s[q.k][0]++;c++}});const p=Math.round(c/EX.length*100);
let h=`<p class="res" style="font-size:24px">ציון: ${p}</p><p>${msg(p)}</p><table><tr><th>נושא</th><th>נכון</th><th>מצב</th></tr>`;const weak=[];
s.forEach((v,k)=>{if(!v[1])return;const r=v[0]/v[1];if(r<1)weak.push(k);h+=`<tr><td>${T[k]}</td><td>${v[0]}/${v[1]}</td><td>${r==1?'✅ שולטת':r>=.5?'⚠️ לחזק':'❌ לחזור'}</td></tr>`});
h+='</table>'+(weak.length?`<p><b>כדאי לחזור על:</b> ${weak.map(k=>`<a href="#" onclick="show('p${k}');return false">${T[k]}</a>`).join(' • ')}</p>`:'<p>🎉 את מוכנה למבחן!</p>');document.getElementById('exam_r').innerHTML=h}
</script></body></html>
