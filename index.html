rd{cursor:pointer;padding:10px;border-radius:10px;background:#f2f4ff;text-align:center}.word.rev{background:#e8fff2}.word{position:relative;padding-left:42px}.speak{position:absolute;left:6px;top:50%;transform:translateY(-50%);border:0;background:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}.small{color:var(--m);font-size:14px}.warn{background:#fff4e6;padding:10px;border-radius:10px}@media(max-width:520px){header h1{font-size:22px}.card{padding:12px}nav button{font-size:13px}}
</style></head><body><header><h1>🇬🇧 הכנה למבחן באנגלית – כיתה ה'</h1><div>אוצר מילים • Grammar • Reading • Writing • תרגול חכם ומבחנים</div></header><nav id="nav"></nav><main id="main"></main><script>

const TOPICS=['Vocabulary','Pronouns','am/is/are','have/has','Present Simple','Reading','Writing'];let level=1,current=[],mode='practice';let history=(()=>{try{return JSON.parse(window.localStorage.getItem('eng5hist')||'[]')}catch(e){return []}})();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],shuffle=a=>[...a].sort(()=>Math.random()-.5),pick=a=>a[Math.floor(Math.random()*a.length)],norm=s=>String(s||'').toLowerCase().replace(/[.!?,’']/g,'').replace(/\s+/g,' ').trim();
function save(){try{window.localStorage.setItem('eng5hist',JSON.stringify(history.slice(-500)))}catch(e){}}
function nav(){const tabs=[['home','📖 הסברים'],['words','📚 מילים'],['practice','✏️ תרגול'],['exam','📝 מבחנים'],['summary','📊 הערכת עצמית']];$('#nav').innerHTML=tabs.map(x=>`<button onclick="show('${x[0]}')" id="n${x[0]}">${x[1]}</button>`).join('')}
function show(id){$$('.page,#nav button').forEach(x=>x.classList.remove('on'));$('#'+id).classList.add('on');$('#n'+id).classList.add('on');if(id==='summary')renderSummary();scrollTo(0,0)}
function levelBox(){return `<div class="grid">${[['קל','היכרות וזיהוי'],['בינוני','יישום במשפטים'],['מתקדם','שילוב והפקה']].map((x,i)=>`<div class="level ${level===i+1?'sel':''}" onclick="level=${i+1};this.parentNode.querySelectorAll('.level').forEach(e=>e.classList.remove('sel'));this.classList.add('sel')"><b>${x[0]}</b><br><span class="small">${x[1]}</span></div>`).join('')}</div>`}
function distract(word){return shuffle(WORDS.filter(x=>x[0]!==word[0])).slice(0,3)}
function qV(l){let w=pick(WORDS);if(l===1){let dir=Math.random()<.5;if(dir)return {topic:'Vocabulary',type:'mc',q:`מה פירוש <b>${w[0]}</b>?`,a:w[1],o:shuffle([w[1],...distract(w).map(x=>x[1])]),why:`${w[0]} = ${w[1]}`};return {topic:'Vocabulary',type:'mc',q:`איך אומרים באנגלית: <b>${w[1]}</b>?`,a:w[0],o:shuffle([w[0],...distract(w).map(x=>x[0])]),why:`${w[1]} = ${w[0]}`}}
if(l===2)return {topic:'Vocabulary',type:'txt',q:`כתבי באנגלית: <b>${w[1]}</b>`,a:w[0],why:`התשובה: ${w[0]}`};return {topic:'Vocabulary',type:'txt',q:`כתבי את המילה/הביטוי באנגלית המתאים: <b>${w[1]}</b>`,a:w[0],why:`${w[0]} = ${w[1]}`}}
const names=[['Dan','he'],['Maya','she'],['the dog','it'],['Tom and Ben','they'],['my sister and I','we'],['the books','they']];function qPron(l){let x=pick(names);return {topic:'Pronouns',type:l===1?'mc':'txt',q:`החליפי את <b>${x[0]}</b> בכינוי גוף: ___`,a:x[1],o:['I','you','he','she','it','we','they'],why:`${x[0]} → ${x[1]}`}}
function qBe(l){let p=pick([['I','am'],['he','is'],['she','is'],['it','is'],['you','are'],['we','are'],['they','are']]);let tail=pick(['happy','at home','ten years old','ready']);return {topic:'am/is/are',type:l===1?'mc':'txt',q:`${p[0]} ___ ${tail}.`,a:p[1],o:['am','is','are'],why:`${p[0]} → ${p[1]}`}}
function qHave(l){let p=pick([['I','have'],['you','have'],['we','have'],['they','have'],['he','has'],['she','has'],['it','has']]);return {topic:'have/has',type:l===1?'mc':'txt',q:`${p[0]} ___ ${pick(['a book','a nice idea','a toy','time'])}.`,a:p[1],o:['have','has'],why:`${p[0]} → ${p[1]}`}}
const verbs=[['play','plays'],['read','reads'],['watch','watches'],['wash','washes'],['go','goes'],['cry','cries'],['study','studies'],['fix','fixes'],['do','does'],['learn','learns'],['help','helps']];function qPS(l){let v=pick(verbs),sub=pick(l===1?[['he',v[1]],['she',v[1]],['they',v[0]],['we',v[0]]]:[['Maya',v[1]],['my father',v[1]],['the kids',v[0]],['my friends',v[0]]]);return {topic:'Present Simple',type:l===1?'mc':'txt',q:`${sub[0]} ___ every day. (${v[0]})`,a:sub[1],o:shuffle([v[0],v[1],v[0]+'s']),why:`עם he/she/it מוסיפים s/es/ies; עם I/you/we/they משתמשים בפועל הבסיסי.`}}
const stories=[`Lina is ten. She lives near a park. Every Saturday she plays with her team and then helps her mother. Lina has a special hobby: she likes chess.`, `Tom and his family visit the pool every August. Tom is eleven. He has a blue toy and his sister has a red blanket. They always eat together after swimming.`];function qRead(l){let s=pick(stories);let set=s.startsWith('Lina')?[['How old is Lina?','ten',['nine','ten','twelve']],['What is Lina’s hobby?','chess',['chess','swimming','reading']],['When does she play with her team?','Saturday',['Monday','Saturday','Friday']]]:[['When does the family visit the pool?','August',['April','August','December']],['What color is the blanket?','red',['red','blue','green']],['Do they eat together?','yes',['yes','no']]];let x=pick(set);return {topic:'Reading',type:l===3?'txt':'mc',story:s,q:x[0],a:x[1],o:x[2],why:`חפשי בטקסט את המידע שמוכיח את התשובה.`}}
function qWrite(l){let x=pick(l===1?[[`I / am / happy`,`I am happy`],[`She / is / nice`,`She is nice`],[`They / are / together`,`They are together`]]:l===2?[[`he / has / a / hobby`,`He has a hobby`],[`Maya / learns / English / every day`,`Maya learns English every day`],[`we / have / a / special / idea`,`We have a special idea`]]:[[`my father / watch / TV / every night`,`My father watches TV every night`],[`she / study / English / every day`,`She studies English every day`],[`the kids / have / a / toy`,`The kids have a toy`]]);return {topic:'Writing',type:'txt',q:`סדרי/תקני למשפט נכון: <b>${x[0]}</b>`,a:x[1],why:`משפט תקין: ${x[1]}`}}
const gens=[qV,qPron,qBe,qHave,qPS,qRead,qWrite];function generate(count,only){let pool=only?gens.filter((g,i)=>TOPICS[i]===only):gens;return Array.from({length:count},()=>pick(pool)(level))}
function qhtml(q,i){let body=q.type==='mc'?shuffle([...new Set(q.o)]).map(o=>`<label class="opt"><input type="radio" name="q${i}" value="${o.replace(/"/g,'&quot;')}"> ${o}</label>`).join(''):`<input type="text" id="a${i}" autocomplete="off" autocapitalize="off">`;return `<div class="card q" id="q${i}">${q.story?`<div class="en" style="background:#f4f6fb;padding:10px;border-radius:9px">${q.story}</div>`:''}<p class="en"><b>${i+1}.</b> ${q.q}</p>${body}<div class="feedback" id="f${i}"></div></div>`}
function start(kind,count=12,topic=null){mode=kind;current=generate(count,topic);let host=kind==='exam'?'exam':'practice';$('#'+host+'Body').innerHTML=current.map(qhtml).join('')+`<div class="card" style="text-align:center"><button class="btn g" onclick="grade()">✔ בדיקה וסיום</button></div>`;show(host)}
function grade(){let right=0,run=[];current.forEach((q,i)=>{let val=q.type==='mc'?(document.querySelector(`input[name=q${i}]:checked`)||{}).value:$('#a'+i).value;let ok=norm(val)===norm(q.a);if(ok)right++;run.push({topic:q.topic,ok,level,mode,date:Date.now()});let box=$('#q'+i),f=$('#f'+i);box.classList.add(ok?'ok':'bad');f.style.display='block';f.innerHTML=(ok?'✅ נכון!':`❌ התשובה: <b class="en">${q.a}</b>`)+`<br><span class=small>${q.why}</span>`});history.push(...run);save();let pct=Math.round(100*right/current.length),weak=weakTopics(run);$('#result').innerHTML=`<div class="card"><div class=stat>ציון: ${pct}</div><p>${pct>=90?'🌟 מצוין!':pct>=75?'👍 עבודה טובה מאוד.':pct>=60?'💪 בדרך הנכונה, צריך עוד תרגול.':'📚 כדאי לחזור על הנושאים החלשים.'}</p>${weak.length?`<p><b>לחיזוק:</b> ${weak.join(' • ')}</p><button class="btn" onclick="adaptive('${weak[0]}')">בני לי תרגול חיזוק עכשיו</button>`:'<p>✅ אין נושא חלש בסבב הזה.</p>'}</div>`;$('#result').scrollIntoView({behavior:'smooth'})}
function weakTopics(arr=history){let m={};arr.forEach(x=>{m[x.topic]??=[0,0];m[x.topic][1]++;if(x.ok)m[x.topic][0]++});return Object.entries(m).filter(([k,v])=>v[1]>=1&&v[0]/v[1]<.75).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(x=>x[0])}
function adaptive(topic){level=Math.max(1,Math.min(3,level));start('practice',12,topic)}
function renderSummary(){let m={};history.forEach(x=>{m[x.topic]??=[0,0];m[x.topic][1]++;if(x.ok)m[x.topic][0]++});let rows=TOPICS.map(t=>{let v=m[t]||[0,0],p=v[1]?Math.round(v[0]/v[1]*100):0;return `<tr><td>${t}</td><td>${v[1]}</td><td>${p}%</td><td><div class=bar><i style="width:${p}%"></i></div></td></tr>`}).join('');let weak=weakTopics();$('#sumBody').innerHTML=`<div class=card><h2>התקדמות מצטברת</h2><table><tr><th>נושא</th><th>שאלות</th><th>הצלחה</th><th></th></tr>${rows}</table></div><div class=card><h3>הערכה והמלצה</h3>${history.length? (weak.length?`<p>הנושאים שכדאי לחזק כרגע: <b>${weak.join(', ')}</b>.</p>${weak.slice(0,3).map(t=>`<button class="btn" onclick="adaptive('${t}')">תרגול חיזוק: ${t}</button>`).join(' ')}`:`<p>🌟 בכל הנושאים שנמדדו ההצלחה היא לפחות 75%.</p>`):'<p>עדיין אין תוצאות. התחילי תרגול או מבחן.</p>'}<p class=small>הסיכום נשמר במכשיר הזה בלבד.</p><button class="btn gray" onclick="if(confirm('למחוק את כל ההיסטוריה?')){history=[];save();renderSummary()}">איפוס היסטוריה</button></div>`}
function speakWord(text){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}catch(e){}}
function flipWord(btn){const en=btn.dataset.en,he=btn.dataset.he,rev=btn.dataset.rev==='1';btn.dataset.rev=rev?'0':'1';btn.classList.toggle('rev',!rev);btn.querySelector('.wt').textContent=rev?en:he}
function words(){let list=shuffle(WORDS);$('#wordGrid').innerHTML=list.map(w=>{const en=w[0].replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');const he=w[1].replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');return `<div class=word data-en="${en}" data-he="${he}" data-rev="0"><span class=wt onclick="flipWord(this.parentNode)">${en}</span><button type=button class=speak title="השמעה" aria-label="השמעת ${en}" onclick="event.stopPropagation();speakWord(this.parentNode.dataset.en)">🔊</button></div>`}).join('')}
function build(){nav();$('#main').innerHTML=`<section id=home class=page><div class=card><h2>📖 הסברים לכל חומר המבחן</h2><h3>1. Vocabulary</h3><p>יש ללמוד את פירוש המילים וגם לזהות אותן בתוך משפט. בלשונית <b>מילים</b> אפשר להפוך כל כרטיס לתרגום ולשמוע הגייה.</p><h3>2. Pronouns</h3><p class=en>I = אני • you = אתה/את/אתם • he = הוא • she = היא • it = חפץ/חיה • we = אנחנו • they = הם/הן</p><h3>3. am / is / are</h3><p class=en><b>I am</b> • <b>he/she/it is</b> • <b>you/we/they are</b></p><h3>4. have / has</h3><p class=en><b>he/she/it has</b> • <b>I/you/we/they have</b></p><h3>5. Present Simple</h3><p>עם he/she/it מוסיפים לפועל בדרך כלל <b>s</b>. אחרי s, sh, ch, x, o לרוב מוסיפים <b>es</b>. כאשר פועל מסתיים בעיצור + y, מחליפים ל-<b>ies</b>.</p><p class=en>play → plays • watch → watches • study → studies</p><h3>6. Reading</h3><p>קוראים קודם את השאלה, מסמנים מילת מפתח, חוזרים לטקסט ומחפשים משפט שמוכיח את התשובה.</p><h3>7. Writing</h3><p>סדר בסיסי: <span class=en>Subject + verb + rest.</span> בודקים אות גדולה בתחילת המשפט, התאמת הפועל לנושא וסימן פיסוק בסוף.</p></div><div class=card><h2>איך מתכוננים?</h2><p>לאחר ההסברים עוברים למילים, בוחרים רמת קושי בתרגול, ולבסוף מבצעים מבחן. המערכת שומרת את התוצאות במכשיר ובונה תרגולי חיזוק לנושאים החלשים.</p>${levelBox()}</div></section><section id=words class=page><div class=card><h2>📚 אוצר המילים המעודכן</h2><p>המילים הוחלפו לפי צילום עמוד REVIEW החדש. לחצי על המילה כדי לראות את התרגום. לחצי על 🔊 כדי לשמוע את ההגייה באנגלית.</p><button class=btn onclick=words()>ערבבי מחדש</button><div id=wordGrid class=grid></div></div></section><section id=practice class=page><div class=card><h2>✏️ תרגול</h2>${levelBox()}<p><button class=btn onclick="start('practice',12)">🔄 דף חדש לגמרי</button></p></div><div id=practiceBody></div><div id=result></div></section><section id=exam class=page><div class=card><h2>📝 מבחן לפי רמה</h2>${levelBox()}<p><button class="btn g" onclick="start('exam',20)">🔄 צור מבחן חדש</button></p></div><div id=examBody></div><div id=result></div></section><section id=summary class=page><div id=sumBody></div></section>`;words();show('home')}
build();
</script></body></html>
